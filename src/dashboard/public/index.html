<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>StopCode - Know when to exit the loop.</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="app">
    <header class="site-header">
      <div class="container header-row">
        <div class="brand">
          <h1 class="brand-name">StopCode</h1>
          <p class="tagline">Know when to exit the loop.</p>
        </div>
        <div class="header-controls">
          <div class="project-switch" id="project-switch" hidden>
            <label for="project-select" class="label">Project</label>
            <select id="project-select" class="input"></select>
          </div>
          <div class="clock-out-wrap" id="clock-out-wrap" hidden>
            <button type="button" class="btn btn-primary btn-lg" id="clock-out-btn" aria-describedby="clock-out-reason">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
              <span>Clock out</span>
            </button>
            <span id="clock-out-reason" class="hint" hidden></span>
          </div>
        </div>
      </div>
      <nav class="container" aria-label="Dashboard sections">
        <div class="tabs" role="tablist" aria-label="Dashboard sections">
          <button type="button" role="tab" id="tab-today" class="tab" aria-selected="true" aria-controls="panel" data-route="today" tabindex="0">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0z"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <span>Today</span>
          </button>
          <button type="button" role="tab" id="tab-chat" class="tab" aria-selected="false" aria-controls="panel" data-route="chat" tabindex="-1">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
            <span>Wellness chat</span>
          </button>
          <button type="button" role="tab" id="tab-planner" class="tab" aria-selected="false" aria-controls="panel" data-route="planner" tabindex="-1">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><path d="M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M3 10h18"/></svg>
            <span>Planner</span>
          </button>
          <button type="button" role="tab" id="tab-history" class="tab" aria-selected="false" aria-controls="panel" data-route="history" tabindex="-1">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
            <span>History</span>
          </button>
          <button type="button" role="tab" id="tab-settings" class="tab" aria-selected="false" aria-controls="panel" data-route="settings" tabindex="-1">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4h-3"/><path d="M14 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M18 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/></svg>
            <span>Settings</span>
          </button>
        </div>
      </nav>
    </header>

    <div id="banner" class="container banner-slot"></div>

    <main id="main" class="container" tabindex="-1">
      <section id="panel" role="tabpanel" aria-labelledby="tab-today" class="panel"></section>
    </main>

    <footer class="container site-footer">
      <p>Local only. This page talks to the StopCode server on 127.0.0.1 and makes no other network requests. No telemetry. Elapsed times are wall-clock durations between recorded events, not focused time.</p>
    </footer>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="dialogs"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
